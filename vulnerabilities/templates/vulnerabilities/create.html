{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Wróć
            </a>
            <div>
                <h4 class="fw-bold mb-0">Nowa podatność</h4>
                <small class="text-muted">Wypełnij formularz zgłoszenia</small>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" action="{% url 'create_vulnerability' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary">Anuluj</a>
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-plus-lg me-1"></i>Zgłoś
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
