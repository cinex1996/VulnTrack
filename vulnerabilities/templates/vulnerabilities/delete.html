{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card border-0 shadow-sm border-top border-danger border-3">
            <div class="card-body p-4 text-center">
                <i class="bi bi-trash3-fill text-danger" style="font-size:2.5rem;"></i>
                <h5 class="fw-bold mt-3 mb-1">Usuń podatność</h5>
                <p class="text-muted small mb-4">Czy na pewno chcesz usunąć tę podatność? Tej operacji nie można cofnąć.</p>

                <div class="card bg-light border-0 mb-4 text-start">
                    <div class="card-body py-2 px-3">
                        <span class="text-muted small">Podatność:</span>
                        <div class="fw-semibold">{{ vulnerability.title }}</div>
                    </div>
                </div>

                <form method="POST" action="{% url 'delete_vulnerability' vulnerability.id %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary">Anuluj</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Usuń
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
