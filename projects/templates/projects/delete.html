{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="w-100" style="max-width: 28rem;">

        <div class="card shadow-sm border-top border-danger border-3">
            <div class="card-body p-4 text-center">
                <i class="bi bi-trash3-fill text-danger fs-1"></i>
                <h5 class="fw-bold mt-3 mb-1">Usuń projekt</h5>
                <p class="text-muted small mb-3">Czy na pewno chcesz usunąć ten projekt? Tej operacji nie można cofnąć.</p>

                <div class="bg-light rounded-3 mb-3 text-start">
                    <div class="py-2 px-3">
                        <span class="text-muted small">Projekt:</span>
                        <div class="fw-semibold">{{ project.name }}</div>
                    </div>
                </div>

                <form method="POST" action="{% url 'project_delete' project.pk %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'project_detail' project.pk %}" class="btn btn-outline-secondary">Anuluj</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Usuń
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
