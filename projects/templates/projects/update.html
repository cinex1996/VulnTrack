{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="w-100" style="max-width: 42rem;">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="{% url 'project_list' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>Wróć
            </a>
            <div>
                <h4 class="fw-bold mb-0">Edytuj projekt</h4>
                <small class="text-muted">Zmień dane projektu</small>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST" class="form-styled">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{% url 'project_list' %}" class="btn btn-outline-secondary">Anuluj</a>
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-check-lg me-1"></i>Zapisz
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
