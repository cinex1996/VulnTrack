{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">

        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-dark" style="font-size:2.5rem;"></i>
            <h4 class="fw-bold mt-2 mb-0">VulnTrack</h4>
            <small class="text-muted">Utwórz nowe konto</small>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ register_form.as_p }}
                    <button type="submit" class="btn btn-dark w-100 mt-2">
                        <i class="bi bi-person-plus me-1"></i>Zarejestruj się
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted small mt-3">
            Masz już konto?
            <a href="{% url 'login' %}" class="text-dark fw-semibold">Zaloguj się</a>
        </p>

    </div>
</div>

{% endblock %}
