{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center mt-5">
    <div class="w-100" style="max-width: 24rem;">

        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-dark fs-1"></i>
            <h4 class="fw-bold mt-2 mb-0">VulnTrack</h4>
            <small class="text-muted">Zaloguj się do swojego konta</small>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Nazwa użytkownika</label>
                        <input type="text" name="username" id="username" placeholder="Wpisz nazwę użytkownika"
                               class="form-control">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Hasło</label>
                        <input type="password" name="password" id="password" placeholder="Wpisz hasło"
                               class="form-control">
                    </div>
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Zaloguj
                    </button>
                </form>
                <a href="{% url 'password_reset' %}" class="small text-primary">
                        Zapomniałeś hasła?
                </a>
            </div>
        </div>

        <p class="text-center text-muted small mt-3">
            Nie masz konta?
            <a href="{% url 'register' %}" class="text-dark fw-semibold">Zarejestruj się</a>
        </p>

    </div>
</div>

{% endblock %}
