{% extends 'base.html' %}

{% block content %}

<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">

    <div class="card shadow w-100" style="max-width: 28rem;">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h1 class="fs-3 fw-bold">Reset hasła</h1>
                <p class="small text-muted mt-2">
                    Podaj adres e-mail przypisany do konta. Wyślemy instrukcję resetowania hasła.
                </p>
            </div>

            <form method="post" class="form-styled">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-dark w-100 mt-2">
                    Wyślij link resetujący hasło
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="small text-primary">
                    Wróć do logowania
                </a>
            </div>

        </div>
    </div>

</div>

{% endblock %}
