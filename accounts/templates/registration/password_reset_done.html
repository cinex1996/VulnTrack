{% extends 'base.html' %}

{% block content %}

<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">

    <div class="card shadow w-100" style="max-width: 28rem;">
        <div class="card-body p-4 text-center">

            <i class="bi bi-envelope-check-fill text-success fs-1"></i>

            <h1 class="fs-3 fw-bold mt-3">Sprawdź skrzynkę</h1>
            <p class="small text-muted mt-2">
                Jeśli podany adres e-mail istnieje w naszej bazie, wysłaliśmy na niego instrukcję
                resetowania hasła. Link jest aktywny przez ograniczony czas.
            </p>

            <a href="{% url 'login' %}" class="btn btn-dark w-100 mt-3">
                Wróć do logowania
            </a>

        </div>
    </div>

</div>

{% endblock %}
